display_mode = "gpu"
min_scale = 0.5
max_scale = 3.0
# 修饰键: left_alt | right_alt | left_ctrl | right_ctrl | left_shift | right_shift | left_gui | right_gui
mod_key = "left_alt"
# 排序方式: name | created_desc | created_asc | modified_desc | modified_asc
sort = "name"
screenshot_dir = "screenshots"
# 是否无边框
borderless = true
# 是否不显示标题文字（仅对无边框生效）
no_title_text = false

[animation]
image_switch = true

[shaders]
dir = "shaders"
background = "background.slang"

[models]
dir = "models"

[models.birefnet]
standard_model = "BiRefNet.onnx"
lite_model = "BiRefNet_lite.onnx"
used_variant = "lite"
disable_memory_optimization = true # 禁用内存优化

[models.magic_touch]
model = "magic_touch.onnx"
