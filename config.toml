display_mode = "gpu"
min_scale = 0.5
max_scale = 3.0
# 修饰键: left_alt | right_alt | left_ctrl | right_ctrl | left_shift | right_shift | left_gui | right_gui
mod_key = "left_alt"
# 排序方式: name | created_desc | created_asc | modified_desc | modified_asc
sort = "name"

[screenshot]
dir = "screenshots"
# 截图的输出格式: png | avif | jpg
format = "png"

[titlebar]
custom = true
opacity = 0.15 # 取值范围 0.0 - 1.0，仅对自定义标题栏生效
hidden_file_size = true # 隐藏图片尺寸
hidden_app_name = true # 隐藏应用后缀
hidden_all_text = false # 隐藏全部文字，仅对自定义标题栏生效

[animation]
image_switch = true

[shaders]
dir = "test/shaders"
# 预设: classic | rainbow | tiles
# 或自定义 .slang, 背景着色器需放在 background 目录
background = "tiles"

# 手动激活的着色器（绑定快捷键）
[shaders.custom.o]
keybind = "left_shift+o"
[shaders.custom.p]
keybind = "left_shift+p"

[models]
dir = "models"

[models.birefnet]
standard_model = "BiRefNet.onnx"
lite_model = "BiRefNet_lite.onnx"
used_variant = "lite"
disable_memory_optimization = true # 禁用内存优化

[models.magic_touch]
model = "magic_touch.onnx"
