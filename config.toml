display_mode = "gpu"
min_scale = 0.5
max_scale = 3.0
# 修饰键: left_alt | right_alt | left_ctrl | right_ctrl | left_shift | right_shift | left_gui | right_gui
mod_key = "left_alt"
# 排序方式: name | created_desc | created_asc | modified_desc | modified_asc
sort = "name"

[screenshot]
dir = "screenshots"
# 截图的输出格式: png | avif | jpg
format = "jpg"

[titlebar]
custom = true
opacity = 0.25 # 取值范围 0.0 - 1.0，仅对自定义标题栏生效
no_text = false # 仅对自定义标题栏生效
no_size = true
no_app = true

[animation]
image_switch = true

[shaders]
dir = "shaders/user"
# 预设: classic | rainbow | tiles
# 或自定义 .slang, 背景着色器需放在 background 目录
background = "tiles"

[models]
dir = "models"

[models.birefnet]
standard_model = "BiRefNet.onnx"
lite_model = "BiRefNet_lite.onnx"
used_variant = "lite"
disable_memory_optimization = true # 禁用内存优化

[models.magic_touch]
model = "magic_touch.onnx"
